name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            docs/**/*.md

  geometry:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fit (single unit)
            run: scripts/check.sh quick
          - name: fit (loaded 2x2 array)
            run: scripts/check.sh array
          - name: thin sections
            run: scripts/thin.sh
          - name: vent alignment
            run: scripts/vent.sh
    steps:
      - uses: actions/checkout@v7
      - run: docker pull openscad/openscad:2021.01
      - run: ${{ matrix.run }}

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: scripts/render.sh
      - uses: actions/upload-artifact@v7
        with:
          name: stl
          path: |
            out/caddy_tray.stl
            out/bezel.stl
            out/plate_top.stl
            out/plate_bottom.stl
            out/wall.stl
            out/rear.stl
            out/coupon.stl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: previews
          path: out/*.png
          if-no-files-found: error
