name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            docs/**/*.md

  geometry:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fit (single unit)
            run: scripts/check.sh quick
          - name: fit (loaded 2x2 array)
            run: scripts/check.sh array
          - name: fit (accessories)
            run: scripts/check.sh acc
          - name: vent alignment
            run: scripts/vent.sh
    steps:
      - uses: actions/checkout@v7
      - run: docker pull openscad/openscad:2021.01
      - run: ${{ matrix.run }}

  thin:
    name: thin ${{ matrix.part }} ${{ matrix.axis }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [caddy_tray, bezel, plate, wall, rear, adapter25, foot, joiner_w1, joiner_w05, joiner_h1, joiner_h05, joiner_h3]
        axis: [x, y, z]
    steps:
      - uses: actions/checkout@v7
      - run: docker pull openscad/openscad:2021.01
      - run: scripts/thin.sh "$PART"
        env:
          PART: ${{ matrix.part }}
          AXES: ${{ matrix.axis }}

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: scripts/render.sh
      - uses: actions/upload-artifact@v7
        with:
          name: stl
          path: |
            out/caddy_tray.stl
            out/bezel.stl
            out/plate_top.stl
            out/plate_bottom.stl
            out/wall.stl
            out/rear.stl
            out/coupon.stl
            out/adapter25.stl
            out/foot.stl
            out/joiner_w1.stl
            out/joiner_w05.stl
            out/joiner_h1.stl
            out/joiner_h05.stl
            out/joiner_h3.stl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: previews
          path: out/*.png
          if-no-files-found: error

  assemblies:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: docker pull openscad/openscad:2021.01
      - run: scripts/assemblies.sh
      - uses: actions/upload-artifact@v7
        with:
          name: assemblies
          path: out/assemblies/*.3mf
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, geometry, thin, render, assemblies]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: stl
          path: stl
      - uses: actions/download-artifact@v7
        with:
          name: assemblies
          path: assemblies
      # docs/release-notes/<tag>.md is the release body when it exists
      - run: |
          notes=(--generate-notes)
          [ -f "docs/release-notes/$GITHUB_REF_NAME.md" ] && notes=(--notes-file "docs/release-notes/$GITHUB_REF_NAME.md")
          gh release create "$GITHUB_REF_NAME" stl/*.stl assemblies/*.3mf --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${notes[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
